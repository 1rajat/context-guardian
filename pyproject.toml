[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-guardian"
version = "0.1.0"
description = "Real-time context loss detection for LLM applications — catch lost-in-the-middle failures silently in 2 lines of code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "context-guardian contributors" }]
keywords = [
    "llm", "rag", "context-window", "observability", "lost-in-middle",
    "hallucination", "openai", "anthropic", "monitoring", "needle-in-haystack",
    "benchmark", "faithfulness",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "click>=8.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "sentence-transformers>=2.6",
    "numpy>=1.24",
    "scikit-learn>=1.0",
    "tiktoken>=0.6",
    "rich>=13.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.0",
]

[project.scripts]
context-guardian = "context_guardian.cli:main"

[project.urls]
Homepage   = "https://github.com/1rajat/context-guardian"
Repository = "https://github.com/1rajat/context-guardian"
Issues     = "https://github.com/1rajat/context-guardian/issues"

[tool.hatch.build.targets.wheel]
packages = ["context_guardian"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
