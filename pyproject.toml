[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-stress-test"
version = "0.1.0"
description = "LLM Context Window Stress Tester — needle-in-a-haystack benchmarking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "llm-stress-test contributors" }]
keywords = ["llm", "benchmark", "context-window", "needle-in-a-haystack", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "openai>=1.0",
    "anthropic>=0.25",
    "tiktoken>=0.6",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "numpy>=1.24",
    "rich>=13.0",
    "tqdm>=4.65",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.0",
]

[project.scripts]
llm-stress-test = "llm_stress_test.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/llm-stress-test"
Repository = "https://github.com/your-org/llm-stress-test"
Issues = "https://github.com/your-org/llm-stress-test/issues"

[tool.hatch.build.targets.wheel]
packages = ["llm_stress_test"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
